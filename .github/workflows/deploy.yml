name: Deploy Timelyna

on:
  push:
    branches:
      - dev
      - main
      - production
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Tests et validation
  test:
    name: Tests & Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          
      - name: Run backend tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_full_checklist.py
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: test-secret-key-for-ci
          
      # Frontend tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: ./frontend-v2
        run: npm ci
        
      - name: TypeScript check
        working-directory: ./frontend-v2
        run: npm run type-check || npx tsc --noEmit
        
      - name: Build frontend
        working-directory: ./frontend-v2
        run: npm run build
        
      - name: Run frontend tests (if exists)
        working-directory: ./frontend-v2
        run: npm test -- --run || echo "No tests configured"
        continue-on-error: true

  # Job 2: Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    
    permissions:
      contents: read
      packages: write
      
    strategy:
      matrix:
        service: [backend, frontend]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service == 'frontend' && 'frontend-v2' || matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2b: Build and deploy on OVH after each merge/push to dev
  build-ovh-dev-images:
    name: Build & Deploy OVH Dev
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Validate OVH SSH configuration
        id: ovh_cfg
        env:
          OVH_HOST: ${{ secrets.OVH_HOST != '' && secrets.OVH_HOST || vars.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER != '' && secrets.OVH_USER || vars.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_REPO_TOKEN: ${{ secrets.OVH_REPO_TOKEN }}
        run: |
          if [ -n "$OVH_HOST" ] && [ -n "$OVH_USER" ] && [ -n "$OVH_SSH_KEY" ] && [ -n "$OVH_REPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OVH_HOST/OVH_USER/OVH_SSH_KEY/OVH_REPO_TOKEN missing: skipping OVH image build for this run."
          fi

      - name: Build and deploy on OVH VPS
        if: steps.ovh_cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OVH_HOST != '' && secrets.OVH_HOST || vars.OVH_HOST }}
          username: ${{ secrets.OVH_USER != '' && secrets.OVH_USER || vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/opt/timelyna"
            REPO_URL="https://${{ github.repository_owner }}:${{ secrets.OVH_REPO_TOKEN }}@github.com/${{ github.repository }}.git"

            # Fail fast with a clear message if token cannot read the private repo.
            git ls-remote "$REPO_URL" HEAD >/dev/null

            # Ensure target directory exists and is writable by current SSH user.
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER":"$USER" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf "$APP_DIR"
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$USER":"$USER" "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            # Build fresh images for dev.
            docker compose build --pull backend celery-worker celery-beat frontend

            # Deploy/restart stack.
            docker compose up -d

            # Run DB migrations on the live backend container.
            docker compose exec -T backend alembic upgrade head

            # Simple local healthcheck on VPS.
            curl -fsS http://localhost:8000/health >/dev/null

      - name: OVH build skipped
        if: steps.ovh_cfg.outputs.configured != 'true'
        run: echo "OVH deploy skipped because required SSH configuration is not available in this context."

  # Job 3: Deploy to staging (branch main)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.timelyna.com
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/timelyna
            git pull origin main
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d
            docker-compose -f docker-compose.staging.yml exec -T backend alembic upgrade head
            
      - name: Health check
        run: |
          sleep 10
          curl -f https://staging.timelyna.com/health || exit 1

  # Job 4: Deploy to production (branch production)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://app.timelyna.com
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/timelyna
            git pull origin production
            docker-compose pull
            docker-compose up -d
            docker-compose exec -T backend alembic upgrade head
            
      - name: Health check
        run: |
          sleep 15
          curl -f https://app.timelyna.com/health || exit 1
          
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Job 5: Rollback (manual trigger)
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      
    steps:
      - name: Rollback production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/timelyna
            git checkout HEAD~1
            docker-compose pull
            docker-compose up -d
            docker-compose exec -T backend alembic downgrade -1
