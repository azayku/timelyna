services:
  postgres:
    image: postgres:15-alpine
    container_name: timelyna-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: timelyna
      POSTGRES_USER: timelyna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelyna"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timelyna-network

  redis:
    image: redis:7-alpine
    container_name: timelyna-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timelyna-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timelyna-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://timelyna:${POSTGRES_PASSWORD:-changeme}@postgres:5432/timelyna?ssl=disable
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - timelyna-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timelyna-celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://timelyna:${POSTGRES_PASSWORD:-changeme}@postgres:5432/timelyna?ssl=disable
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - timelyna-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timelyna-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://timelyna:${POSTGRES_PASSWORD:-changeme}@postgres:5432/timelyna?ssl=disable
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - timelyna-network

  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: timelyna-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - timelyna-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: timelyna-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - timelyna-network
    profiles:
      - dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: timelyna-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@timelyna.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - timelyna-network
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  timelyna-network:
    driver: bridge
