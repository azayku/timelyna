events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Proxy timeouts (frontend containers may be slow to respond during cold start)
    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;
    proxy_send_timeout     60s;

    server {
        listen 80;
        server_name _;

        # Redirect bare root to /dev/
        location = / {
            return 301 /dev/;
        }

        # ── dev  (frontend host port 3000) ────────────────────────────────
        location /dev/ {
            proxy_pass         http://host.docker.internal:3000/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Path   /dev;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            # Rewrite cookie Path so dev cookies don't bleed into /uat/
            proxy_cookie_path  /  /dev/;
        }

        # ── uat  (frontend host port 3001) ────────────────────────────────
        location /uat/ {
            proxy_pass         http://host.docker.internal:3001/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Path   /uat;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_cookie_path  /  /uat/;
        }

        # ── uat2 (frontend host port 3002) ────────────────────────────────
        location /uat2/ {
            proxy_pass         http://host.docker.internal:3002/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Path   /uat2;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_cookie_path  /  /uat2/;
        }

        # ── uat3 (frontend host port 3003) ────────────────────────────────
        location /uat3/ {
            proxy_pass         http://host.docker.internal:3003/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Path   /uat3;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_cookie_path  /  /uat3/;
        }

        # Health check for the proxy itself
        location = /health {
            access_log  off;
            return      200 "proxy-healthy\n";
            add_header  Content-Type text/plain;
        }
    }
}
